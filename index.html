<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CROSS DJ - MIXVIBES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#2b2e33;color:#fff}
header{background:#22252a;display:flex;justify-content:space-between;padding:12px}
.jog{width:150px;height:150px;border-radius:50%;background:#ff7a00;border:6px solid #111;margin:10px auto;display:flex;align-items:center;justify-content:center}
.jog-center{width:60px;height:60px;background:#4a2c14;border-radius:50%}
.jog.spin{animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.file-label{display:block;background:#3a3e44;padding:10px;border-radius:8px;margin:10px 0}
.file-label input{display:none}
input[type=range]{accent-color:#ff7a00;width:100%}
.main{display:flex;gap:10px;padding:10px}
.deck{flex:1;text-align:center}
.mixer{width:90px;text-align:center}
.bottom{display:flex;justify-content:center;gap:12px;background:#22252a;padding:12px}
.bottom button{background:#4a4e55;color:#fff;border:none;padding:12px 18px;border-radius:8px}
</style>
</head>
<body>
<header><h1>MIXVIBES</h1><h1>MIXVIBES</h1></header>
<div class="main">
<div class="deck">
<label class="file-label">Load A <input type="file" onchange="loadSong('A',this)" accept="audio/*"></label>
<div class="jog" id="jogA"><div class="jog-center"></div></div>
<input type="range" id="tempoA" min="50" max="150" value="100" oninput="setTempo('A',this.value)"><p>TEMPO</p>
<audio id="audioA"></audio></div>
<div class="mixer"><p>FX</p><br><input type="range" id="crossfader" min="0" max="100" value="50" oninput="setVol()"><p>CROSSFADER</p></div>
<div class="deck">
<label class="file-label">Load B <input type="file" onchange="loadSong('B',this)" accept="audio/*"></label>
<div class="jog" id="jogB"><div class="jog-center"></div></div>
<input type="range" id="tempoB" min="50" max="150" value="100" oninput="setTempo('B',this.value)"><p>TEMPO</p>
<audio id="audioB"></audio></div>
</div>
<div class="bottom">
<button onclick="cueDeck('A')">CUE</button>
<button onclick="playDeck('A')">PLAY</button>
<button onclick="syncTempo()">SYNC</button>
<button onclick="playDeck('B')">PLAY</button>
<button onclick="cueDeck('B')">CUE</button>
  </div><script>
function loadSong(d,input){let a=document.getElementById('audio'+d);a.src=URL.createObjectURL(input.files[0]);a.play();document.getElementById('jog'+d).classList.add('spin');setVol();}
function playDeck(d){let a=document.getElementById('audio'+d);a.play();document.getElementById('jog'+d).classList.add('spin');}
function cueDeck(d){let a=document.getElementById('audio'+d);a.currentTime=0;a.play();}
function setTempo(d,v){document.getElementById('audio'+d).playbackRate=v/100;}
function syncTempo(){let t=document.getElementById('tempoA').value;document.getElementById('tempoB').value=t;setTempo('B',t);}
function setVol(){let c=document.getElementById('crossfader').value/100;document.getElementById('audioA').volume=1-c;document.getElementById('audioB').volume=c;}
setVol();
</script>
</body>
</html>
