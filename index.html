<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIXVIBES V2 - CROSS DJ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#fff;font-family:Arial;text-align:center}
header{background:#16213e;padding:15px;font-size:22px;font-weight:bold;color:#ff7a00}
.main{display:flex;gap:10px;padding:10px;justify-content:center;flex-wrap:wrap}
.deck{flex:1;min-width:280px;background:#0f3460;border-radius:15px;padding:15px}
.jog{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#333 0%,#000 70%);margin:10px auto;display:flex;align-items:center;justify-content:center;border:4px solid #ff7a00}
.jog.spin{animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.jog-center{width:60px;height:60px;background:#ff7a00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#000}
.file-label{display:block;background:#e94560;padding:12px;border-radius:10px;margin:10px 0;cursor:pointer}
.file-label input{display:none}
button{padding:12px 20px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin:5px}
.play{background:#00ff88;color:#000;font-size:18px;width:100%}
input[type=range]{width:100%;accent-color:#ff7a00;margin:8px 0}
label{font-size:13px;color:#ccc}
.mixer{background:#16213e;padding:15px;border-radius:15px;margin:10px}
.cross{width:100%!important;accent-color:#e94560!important}
h3{color:#ff7a00;margin-bottom:10px}
.song{font-size:14px;color:#00ff88;margin:5px}
</style>
</head>
<body>
<header>🎧 MIXVIBES V2 - CROSS DJ</header>
<div class="main">
<div class="deck">
<h3>DECK A</h3>
<div class="jog" id="jogA"><div class="jog-center">A</div></div>
<div class="song" id="songA">Hakuna wimbo</div>
<label class="file-label">📁 CHAGUA WIMBO A<input type="file" id="fileA" accept="audio/*"></label>
<button class="play" onclick="playA()">▶ PLAY A</button>
<label>VOLUME A</label><input type="range" id="volA" min="0" max="1" step="0.01" value="0.8">
<label>TEMPO A</label><input type="range" id="tempoA" min="0.5" max="1.5" step="0.01" value="1">
<label>ECHO A</label><input type="range" id="echoA" min="0" max="0.8" step="0.01" value="0">
</div>
<div class="deck">
<h3>DECK B</h3>
<div class="jog" id="jogB"><div class="jog-center">B</div></div>
<div class="song" id="songB">Hakuna wimbo</div>
<label class="file-label">📁 CHAGUA WIMBO B<input type="file" id="fileB" accept="audio/*"></label>
<button class="play" onclick="playB()">▶ PLAY B</button>
<label>VOLUME B</label><input type="range" id="volB" min="0" max="1" step="0.01" value="0.8">
<label>TEMPO B</label><input type="range" id="tempoB" min="0.5" max="1.5" step="0.01" value="1">
<label>ECHO B</label><input type="range" id="echoB" min="0" max="0.8" step="0.01" value="0">
</div>
</div>
<div class="mixer">
<h3>🎛️ MIXER</h3>
<label>CROSSFADER: A ◀ ▶ B</label>
<input type="range" class="cross" id="cross" min="0" max="1" step="0.01" value="0.5">
<button onclick="autoMix()" style="background:#ff7a00;width:100%">🔀 AUTO MIX</button>
</div><div style="background:#2d0a4e;padding:15px;border-radius:15px;margin:10px">
<h3 style="color:#ff7a00">🎹 DJ EFFECTS</h3>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
<button style="background:#ff0000;color:#fff;padding:15px;border:none;border-radius:10px;font-weight:bold" onclick="airHorn()">📯 AIR HORN</button>
<button style="background:#ff7a00;color:#fff;padding:15px;border:none;border-radius:10px;font-weight:bold" onclick="siren()">🚨 SIREN</button>
<button style="background:#00ccff;color:#fff;padding:15px;border:none;border-radius:10px;font-weight:bold" onclick="boom()">💥 BOOM</button>
<button style="background:#00ff88;padding:15px;border:none;border-radius:10px;font-weight:bold" onclick="rewindFx()">⏪ REWIND</button>
<button style="background:#ff00ff;color:#fff;padding:15px;border:none;border-radius:10px;font-weight:bold" onclick="laser()">🔫 LASER</button>
<button style="background:#ffff00;padding:15px;border:none;border-radius:10px;font-weight:bold" onclick="clap()">👏 CLAP</button>
</div>
<input type="range" id="fxVol" min="0" max="1" step="0.01" value="0.8" style="width:100%;margin-top:10px">
</div>
<script>
let ctx=new (window.AudioContext||window.webkitAudioContext)();
let a={audio:new Audio(),gain:null,delay:null,src:null,playing:false};
let b={audio:new Audio(),gain:null,delay:null,src:null,playing:false};
function setup(d,volId,echoId){
 d.gain=ctx.createGain(); d.delay=ctx.createDelay(1); d.delay.delayTime.value=0.3;
 let fb=ctx.createGain(); fb.gain.value=0.3;
 d.src=ctx.createMediaElementSource(d.audio);
 d.src.connect(d.gain); d.gain.connect(ctx.destination);
 d.src.connect(d.delay); d.delay.connect(fb); fb.connect(d.delay); d.delay.connect(d.gain);
}
setup(a,'volA','echoA'); setup(b,'volB','echoB');
function loadFile(input,deck,songEl,jogEl){
 let f=input.files[0]; if(!f) return;
 deck.audio.src=URL.createObjectURL(f);
 document.getElementById(songEl).textContent="🎵 "+f.name;
}
document.getElementById('fileA').onchange=function(){loadFile(this,a,'songA')};
document.getElementById('fileB').onchange=function(){loadFile(this,b,'songB')};
function playA(){ ctx.resume(); if(a.playing){a.audio.pause();a.playing=false;document.getElementById('jogA').classList.remove('spin')} else {a.audio.play();a.playing=true;document.getElementById('jogA').classList.add('spin')} }
function playB(){ ctx.resume(); if(b.playing){b.audio.pause();b.playing=false;document.getElementById('jogB').classList.remove('spin')} else {b.audio.play();b.playing=true;document.getElementById('jogB').classList.add('spin')} }
function update(){
 let c=parseFloat(document.getElementById('cross').value);
 let vA=parseFloat(document.getElementById('volA').value);
 let vB=parseFloat(document.getElementById('volB').value);
 a.gain.gain.value=vA*(1-c); b.gain.gain.value=vB*c;
 a.audio.playbackRate=parseFloat(document.getElementById('tempoA').value);
 b.audio.playbackRate=parseFloat(document.getElementById('tempoB').value);
}
setInterval(update,100);
function autoMix(){
 let c=document.getElementById('cross'); let v=parseFloat(c.value);
 let i=setInterval(()=>{ v+=0.02; if(v>=1){clearInterval(i)} c.value=v; },100);
}function getFxVol(){ return parseFloat(document.getElementById('fxVol').value); }
function tone(freq,dur,type,vol){
 ctx.resume(); let o=ctx.createOscillator(); let g=ctx.createGain();
 o.type=type||'sawtooth'; o.frequency.value=freq;
 g.gain.value=vol*getFxVol(); o.connect(g); g.connect(ctx.destination);
 o.start(); o.stop(ctx.currentTime+dur);
}
function airHorn(){ tone(233,0.8,'sawtooth',0.5); tone(466,0.8,'sawtooth',0.4); }
function siren(){
 ctx.resume(); let o=ctx.createOscillator(); let g=ctx.createGain();
 o.type='sawtooth'; g.gain.value=0.4*getFxVol(); o.connect(g); g.connect(ctx.destination);
 o.start(); let t=ctx.currentTime; o.frequency.setValueAtTime(400,t); o.frequency.linearRampToValueAtTime(1200,t+0.5); o.frequency.linearRampToValueAtTime(400,t+1); o.stop(t+1.2);
}
function boom(){ tone(60,0.8,'sine',0.9); }
function rewindFx(){
 ctx.resume(); let o=ctx.createOscillator(); let g=ctx.createGain();
 o.type='sawtooth'; g.gain.value=0.3*getFxVol(); o.connect(g); g.connect(ctx.destination);
 o.start(); let t=ctx.currentTime; o.frequency.setValueAtTime(1200,t); o.frequency.linearRampToValueAtTime(100,t+0.6); o.stop(t+0.6);
}
function laser(){ tone(2000,0.2,'square',0.3); }
function clap(){ for(let i=0;i<3;i++){ setTimeout(()=>tone(1000,0.1,'square',0.3), i*120); } }
</script>
</body>
</html>
